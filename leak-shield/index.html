['a2',3,'AIに送る前に、個人情報・秘密のメモを外す','名前・住所・番号・パスワード・顧客情報は送りません。'],

['a4',2,'同期サーバー（Worker）は、トークンなしで401になることを確認する','無認証のままだと、誰でも保存データを読み書きできてしまいます。']]]];
// ---- 漏れた時：種類別 ----
const COMMON=['何が・いつ・どこから漏れたかをメモし、通知メールや画面はスクショで残す','二次被害が出やすい期間（目安：今後3か月）は、不審な連絡に特に注意する'];
const INC=[
['🔑','パスワード・ログイン情報',['同じパスワードを使っているサービスを全部洗い出す（金庫の「🚨 緊急」→「調べる」）','まずメール、次にお金（銀行・カード・決済）、次にSNS、の順で新しいパスワードに変える（パス作成アプリで長く作る）','変更したら、そのサービスで「全端末からログアウト」を押す','二段階認証をつける（認証アプリかパスキー）','ログイン履歴・登録情報・メール転送設定を見て、知らない変更がないか確認する']],
['📧','メールアドレス',['メールアカウントのパスワード変更＋二段階認証をつける','「転送設定」「フィルタ」に知らないルールがないか確認する','今後しばらくは、迷惑メール・なりすましメールが増える前提で、リンクを踏まない','そのメールで登録している重要サービスの「ログイン通知」を見直す']],
['💳','クレジットカード番号',['カード会社の公式窓口（カード裏面の番号）に連絡し、停止・再発行を依頼する','直近の明細に、身に覚えのない請求がないか確認する','再発行後、サブスク・通販・公共料金など、登録しているカード情報を更新する','不正利用があれば、カード会社に申告し、必要なら警察にも相談する']],

['🏠','住所・電話番号・氏名',['知らない番号・「家族を装う」電話・宅配や役所を装う連絡に警戒する','携帯会社のアカウントに、暗証番号や追加認証を設定し、SIMの再発行・機種変更の手続きを守る','郵便物（身に覚えのない請求書やカード）が届いたら、放置せず発送元へ確認する','公開サイトに載ってしまった場合は、サイトの削除依頼フォームから申請する']],

['📱','端末の紛失・盗難',['「探す」で位置を確認し、紛失モード（遠隔ロック）にする','自力で戻らないときは、遠隔でデータ消去する','携帯会社に連絡して、回線を一時停止する','メール・金庫・SNS・決済のパスワードを、別の端末から変更する','盗難なら、警察に遺失物・被害届を出す']],
['🤖','APIキー・トークン',['まず、そのキーを発行したサービスの管理画面で、キーを失効（revoke）させる（履歴の書き換えは、その後でも遅くない）','新しいキーを発行し、環境変数や設定画面にだけ入れる','利用履歴・請求を確認する（身に覚えのない利用がないか）','GitHub に載せた場合は、公開リポジトリ→非公開に変更し、Secret scanning の通知を確認する']]];

function stat(o){const pr=PREV.flatMap(g=>g[2]);const n=pr.length,d=pr.filter(x=>o.p[x[0]]).length;const top=pr.filter(x=>x[1]===3),td=top.filter(x=>o.p[x[0]]).length;return{n,d,top:top.length,td}}
function r1(){const o=load(),s=stat(o);let h='<div class="card"><div style="display:flex;align-items:center"><b style="flex:1">守りの進み具合</b><span>'+s.d+'/'+s.n+'</span></div><div class="bar"><i style="width:'+Math.round(s.d/s.n*100)+'%"></i></div><div class="note">★最優先 '+s.td+'/'+s.top+'。まず★から。全部やらなくて大丈夫、上から順に1つずつ。チェックはこの端末にだけ残ります。</div></div>';

  +'<div class="card"><b>🧭 使い方（1日5分）</b><div class="note" style="margin-top:6px">1. 「① 守る」の★最優先を、1日1つずつ<br>2. 月に1回、crypto-vault で「調べる」<br>3. 怪しい連絡が来たら、リンクを押さずに「② 漏れた！」で確認<br>4. 漏れたら、種類を選んで上から順に</div></div>'

// ---- 変更候補（この端末の中だけで作り、保存しません）----
function rnd(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return a}
function pick(cs,n){const lim=Math.floor(4294967296/cs.length)*cs.length;let o='';while(o.length<n){for(const x of rnd(n*2)){if(x<lim&&o.length<n)o+=cs[x%cs.length]}}return o}
function newPw(){const L='abcdefghijkmnopqrstuvwxyz',U='ABCDEFGHJKLMNPQRSTUVWXYZ',D='23456789',S='!@#$%^&*-_=+?';let t;do{t=pick(L+U+D+S,20)}while(!(/[a-z]/.test(t)&&/[A-Z]/.test(t)&&/[2-9]/.test(t)&&/[^a-zA-Z0-9]/.test(t)));return t}

let CAND=null;
function mkCand(){CAND={pw:[newPw(),newPw(),newPw()],ml:[newMail(),newMail(),newMail()]}}

['Yahoo!メール（Yahoo! JAPAN）','Yahoo! JAPAN IDが、そのままアドレスです。変更はできません。','新しいIDを作って移行します。'],
['Microsoft（outlook.com / hotmail）','アカウントに「別名（エイリアス）」を追加し、メインに切り替えられます。4社の中で、いちばん簡単です。','変更回数に上限があります。公式サイトで確認してください。'],
['Apple（iCloudメール）','@icloud.com の部分は変更できません。','Apple IDが他社のメールなら変更できます。iCloudには、別名と「メールを非公開」があり、サービスごとに別のアドレスを使えます。']];
function candHtml(i){const sets=(i==='0'||i==='1');if(!(sets||i==='6'||i==='7'))return'';if(!CAND)mkCand();
  let h='<div class="card"><b>🔄 変更の候補</b>';
  if(sets)h+='<div class="warn red" style="margin-top:8px"><b>メールとパスワードは、セットで狙われます。</b><br>漏れた「メール＋パスワード」の組み合わせは、他のサービスにも自動で試されます（使い回しがあると、そこから入られます）。<b>メールを守る → 同じパスワードのサービスを順に変える</b>、の順で、必ず両方やります。</div>';
  h+='<div class="note" style="margin:10px 0 4px">新しいパスワード（20文字・この画面で作り、保存しません）</div>'+CAND.pw.map((x,k)=>'<div class="cand"><span>'+esc(x)+'</span><button class="sm" data-cp="pw'+k+'">📋</button></div>').join('')
   +'<div class="note">コピーは60秒で消そうとします。すぐ crypto-vault の入力欄に貼ってください。サービスごとに、別のものを使います。</div>';
  if(sets)h+='<div class="note" style="margin:14px 0 4px">新しいメールアドレスの候補（@の前の部分）</div>'+CAND.ml.map((x,k)=>'<div class="cand"><span>'+esc(x)+'</span><button class="sm" data-cp="ml'+k+'">📋</button></div>').join('')
   +'<div class="note">本名・生年月日・電話番号は入れません。空いているかは、作成画面で確認します。</div>';
  h+='<div style="margin-top:10px"><button class="sm" data-regen="1">🎲 別の候補を出す</button></div></div>';
  if(sets)h+='<div class="card"><b>📮 アドレスは変えられる？</b><div class="note" style="margin:6px 0">結論：<b>アドレス自体は、変えられないことが多い</b>です（※私の知る範囲です。仕様は変わるので、最後は公式で確認を）。多くの場合は、<b>アドレスは変えず、パスワードと二段階認証で守る</b>のが現実的です。新しいアドレスが必要なのは、「アドレス自体が悪用・迷惑メールの標的」になったときです。</div><table><tr><th>サービス</th><th>アドレスの変更</th></tr>'+PROV.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'<br><span style="color:var(--mut)">'+esc(r[2])+'</span></td></tr>').join('')+'</table>'
   +'<div class="note" style="margin-top:10px"><b>新しいアドレスに移るとき</b><br>① 先に新アドレスを作り、二段階認証をつける<br>② 登録先を、重要順（銀行・カード・Apple/Google・SNS）に、新アドレスへ変更<br>③ 古いアドレスは、すぐ消さず、転送や確認用に半年〜1年残す<br>④ 登録先は、金庫の一覧が、そのまま変更の順番表になります</div></div>';
  return h}
let cur='';
function go(n){['1','2','3'].forEach(x=>{$('t'+x).className=x===n?'sel':'';$('v'+x).hidden=x!==n});({1:r1,2:r2,3:r3})[n]()}
['1','2','3'].forEach(n=>$('t'+n).onclick=()=>go(n));
$('v1').addEventListener('change',e=>{const c=e.target.closest('[data-p]');if(!c)return;const o=load();if(c.checked)o.p[c.dataset.p]=Date.now();else delete o.p[c.dataset.p];save(o);const g=[...document.querySelectorAll('#v1 details')].findIndex(d=>d.open);location.hash='g='+Math.max(0,g);r1()});
$('v2').addEventListener('change',e=>{const c=e.target.closest('[data-i]');if(!c)return;const[k,j]=c.dataset.i.split(':');const o=load();o.i[k]=o.i[k]||{};if(c.checked)o.i[k][j]=Date.now();else delete o.i[k][j];if(!o.since[k])o.since[k]=Date.now();save(o);r2()});
$('v2').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k){cur=k.dataset.k;mkCand();r2();return}
  if(e.target.closest('[data-regen]')){mkCand();r2();return}
  const c=e.target.closest('[data-cp]');if(c&&CAND){const t=c.dataset.cp,v=t.slice(0,2)==='pw'?CAND.pw[+t[2]]:CAND.ml[+t[2]];
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{c.textContent='✓';setTimeout(()=>{c.textContent='📋'},1500);setTimeout(()=>{navigator.clipboard.writeText('').catch(()=>{})},60000)}).catch(()=>{c.textContent='×'})}});
$('bReset').onclick=()=>{if(confirm('チェックを全部消します。よろしいですか？')){try{localStorage.removeItem(KEY)}catch(e){}cur='';go('1')}};
// security-hub へは「件数」だけ渡す
function bridge(o){try{const s=stat(o);localStorage.setItem('secbridge_leak_shield',JSON.stringify({t:Date.now(),done:s.d,total:s.n,topDone:s.td,topTotal:s.top}))}catch(e){}}
go('1');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
