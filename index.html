    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700&display=swap');

    :root {
      --primary:    #00ff41;
      --accent:     #00d9ff;
      --secondary:  #ff006e;
      --warning:    #ffa500;
      --bg:         #0a0e27;
      --bg2:        #050813;
      --surface:    rgba(20,25,50,0.7);
      --border:     rgba(0,255,65,0.3);
      --text:       #e0e0e0;
      --muted:      #606880;
      --glow:       0 0 12px rgba(0,255,65,0.35);
      --glow-acc:   0 0 12px rgba(0,217,255,0.35);
      --safe-top:    max(env(safe-area-inset-top), 12px);
      --safe-bottom: max(env(safe-area-inset-bottom), 12px);
      --safe-h:      max(env(safe-area-inset-left), 20px);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #111830 60%, #0a0e27 100%);
      min-height: 100vh;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 0;
      animation: scan 12s linear infinite;
    }
    @keyframes scan { from{transform:translateY(0)} to{transform:translateY(6px)} }

    /* â”€â”€ HEADER â”€â”€ */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5,8,19,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--primary);
      padding: 14px var(--safe-h);
      box-shadow: var(--glow);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 17px; letter-spacing: 3px;
      color: var(--primary);
      text-shadow: var(--glow);
    }
    .logo span { color: var(--accent); }
    .bridge-status {
      font-size: 11px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }
    .dot.live { background: var(--primary); box-shadow: var(--glow); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* â”€â”€ MAIN â”€â”€ */
    main {
      max-width: 1100px; margin: 0 auto;
      padding: 28px var(--safe-h);
      position: relative; z-index: 1;
    }

    /* â”€â”€ SECTION TITLE â”€â”€ */
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,217,255,0.2);
    }
    .section-title:first-of-type { margin-top: 0; }

    /* â”€â”€ ROLE BAR â”€â”€ */
    .role-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .role-left {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--muted);
    }
    .role-icon { font-size: 18px; }
    .role-badge {
      font-size: 11px; font-weight: 700;
      padding: 3px 12px; border-radius: 20px;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .badge-owner  { background: rgba(255,165,0,0.18);  color: var(--warning); border: 1px solid rgba(255,165,0,0.4); }
    .badge-family { background: rgba(0,217,255,0.12);  color: var(--accent);  border: 1px solid rgba(0,217,255,0.35); }
    .badge-guest  { background: rgba(96,104,128,0.18); color: var(--muted);   border: 1px solid rgba(96,104,128,0.4); }
    .role-sel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(5,8,19,0.8);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .role-sel:focus { border-color: var(--accent); }

    /* â”€â”€ STAT ROW â”€â”€ */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 16px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover { border-color: var(--accent); box-shadow: var(--glow-acc); }
    .stat-val {
      font-size: 30px; font-weight: 700;
      color: var(--primary);
      text-shadow: var(--glow);
      line-height: 1;
    }
    .stat-lbl {
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1.5px;
      margin-top: 6px;
    }

    /* â”€â”€ APP GRID â”€â”€ */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 20px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .app-card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,255,65,0.03), transparent);
      pointer-events: none;
    }
    .app-card:hover { border-color: var(--primary); box-shadow: var(--glow); transform: translateY(-2px); }
    .app-card.hub   { border-color: rgba(0,217,255,0.5); }
    .app-card.hub:hover { border-color: var(--accent); box-shadow: var(--glow-acc); }

    .app-icon { font-size: 26px; margin-bottom: 10px; }
    .app-name {
      font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700;
      color: var(--primary); margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .app-card.hub .app-name { color: var(--accent); }
    .app-desc { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
    .app-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; margin-bottom: 14px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .s-live { background: var(--primary); box-shadow: var(--glow); }
    .s-hub  { background: var(--accent);  box-shadow: var(--glow-acc); }
    .s-idle { background: var(--muted); }
    .app-link {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 4px;
      padding: 5px 12px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }
    .app-link:hover { background: rgba(0,255,65,0.1); box-shadow: var(--glow); }
    .app-card.hub .app-link { color: var(--accent); border-color: var(--accent); }
    .app-card.hub .app-link:hover { background: rgba(0,217,255,0.1); box-shadow: var(--glow-acc); }

    /* â”€â”€ SKILL GRID â”€â”€ */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .skill-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    }
    .badge-done {
      background: rgba(0,255,65,0.2); color: var(--primary);
      border: 1px solid rgba(0,255,65,0.4);
    }
    .badge-lock {

    }
    .bar-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.7s cubic-bezier(0.23,1,0.32,1);
    }
    .skill-score { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* â”€â”€ UNLOCK GRID â”€â”€ */
    .unlock-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .unlock-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex; align-items: center; gap: 10px;
      transition: all 0.3s;
    }
    .unlock-item.unlocked {
      border-color: var(--primary);
      background: rgba(0,255,65,0.06);
      box-shadow: var(--glow);
    }
    .unlock-icon { font-size: 20px; }
    .unlock-info { }
    .unlock-name { font-size: 11px; font-weight: 600; color: var(--muted); }
    .unlock-item.unlocked .unlock-name { color: var(--text); }
    .unlock-src  { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* â”€â”€ EVENT LOG â”€â”€ */
    .event-log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      max-height: 220px;
      overflow-y: auto;
    }
    .event-log::-webkit-scrollbar { width: 4px; }
    .event-log::-webkit-scrollbar-track { background: transparent; }
    .event-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .event-entry {
      display: grid;
      grid-template-columns: 48px 90px 1fr;
      gap: 10px; align-items: start;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 11px;
    }
    .event-entry:last-child { border-bottom: none; }
    .event-ts { color: var(--muted); }
    .event-type {
      font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 3px;
      text-align: center; white-space: nowrap;
    }
    .et-skill  { background: rgba(0,255,65,0.15);  color: var(--primary); }
    .et-badge  { background: rgba(0,217,255,0.15); color: var(--accent); }
    .et-unlock { background: rgba(255,165,0,0.15); color: var(--warning); }
    .et-sys    { background: rgba(96,104,128,0.2); color: var(--muted); }
    .event-msg { color: var(--text); line-height: 1.5; }
    .log-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; }

    /* â”€â”€ FOOTER â”€â”€ */
    footer {
      text-align: center;
      padding: 24px var(--safe-h);
      font-size: 11px; color: var(--muted);
      border-top: 1px solid rgba(0,255,65,0.1);
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto;
    }
    footer a { color: var(--primary); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* â”€â”€ RESPONSIVE â”€â”€ */
    @media (max-width: 768px) {
      .stat-row    { grid-template-columns: repeat(2,1fr); }
      .app-grid    { grid-template-columns: 1fr; }
      .skill-grid  { grid-template-columns: 1fr; }
      .unlock-grid { grid-template-columns: repeat(2,1fr); }
      .event-entry { grid-template-columns: 44px 80px 1fr; }
    }
    @media (max-width: 480px) {
      .stat-row    { grid-template-columns: repeat(2,1fr); }
      .unlock-grid { grid-template-columns: 1fr; }
      .stat-val    { font-size: 24px; }
    }
  </style>
</head>

function saveToiCloud() {
  const data = {
    source: 'security-hub', exportedAt: Date.now(),
    unlocks:  JSON.parse(localStorage.getItem('secbridge_unlocks')  || '[]'),
    progress: JSON.parse(localStorage.getItem('secbridge_progress') || '{}'),
    events:   JSON.parse(localStorage.getItem('secbridge_events')   || '[]')
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const filename = `security-hub-${new Date().toISOString().slice(0,10)}.json`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

    setTimeout(()=>alert(`"${filename}"\nƒtƒ@ƒCƒ‹ƒAƒvƒŠ ¨ iCloud Drive ‚ÉˆÚ“®‚µ‚Ä‚­‚¾‚³‚¢B`),500);
}
