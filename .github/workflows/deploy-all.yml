# .github/workflows/deploy-all.yml
# 全3アプリ（security-hub / whitehacker-lab / crypto-vault）統合 CD パイプライン
#
# 配置場所: security-hub リポジトリの .github/workflows/deploy-all.yml
#
# トリガー:
#   - security-hub の master/main push → security-hub を GitHub Pages デプロイ
#   - 他リポジトリのステータスを確認し、異常があれば Issues に通知
#
# 必要な Secrets（Settings → Secrets → Actions）:
#   PERSONAL_ACCESS_TOKEN : repo / workflow スコープ付きの PAT

name: 🔐 Security Hub — Deploy All

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:           # 手動実行ボタン
  schedule:
    - cron: '0 20 * * *'      # 毎日 JST 05:00 に自動ヘルスチェック

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  # ────────────────────────────────────────────
  # JOB 1: security-hub を GitHub Pages にデプロイ
  # ────────────────────────────────────────────
  deploy-security-hub:
    name: 🚀 Deploy security-hub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index.html
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html が見つかりません"
            exit 1
          fi
          echo "✅ index.html 確認 OK ($(wc -c < index.html) bytes)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output URL
        run: echo "🌐 デプロイ完了: ${{ steps.deployment.outputs.page_url }}"

  # ────────────────────────────────────────────
  # JOB 2: 全アプリのヘルスチェック
  # ────────────────────────────────────────────
  health-check:
    name: 🩺 Health Check — All Apps
    runs-on: ubuntu-latest
    needs: [ deploy-security-hub ]
    if: always()
    steps:
      - name: Check security-hub
        id: check-hub
        run: |
          URL="https://norinori-jan.github.io/security-hub/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "✅ security-hub: $STATUS"
          else
            echo "⚠️ security-hub: $STATUS"
          fi

      - name: Check whitehacker-lab
        id: check-lab
        run: |
          URL="https://norinori-jan.github.io/whitehacker-lab/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "whitehacker-lab: $STATUS"

      - name: Check crypto-vault
        id: check-vault
        run: |
          URL="https://norinori-jan.github.io/crypto-vault/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "crypto-vault: $STATUS"

      - name: Summary
        run: |
          echo "## 🔐 Security Hub — ヘルスチェック結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| アプリ | ステータス |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| security-hub  | ${{ steps.check-hub.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| whitehacker-lab | ${{ steps.check-lab.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| crypto-vault  | ${{ steps.check-vault.outputs.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Create Issue on failure
        if: |
          steps.check-hub.outputs.status != '200' ||
          steps.check-lab.outputs.status != '200' ||
          steps.check-vault.outputs.status != '200'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const failed = [];
            if ('${{ steps.check-hub.outputs.status }}'   !== '200') failed.push('security-hub');
            if ('${{ steps.check-lab.outputs.status }}'   !== '200') failed.push('whitehacker-lab');
            if ('${{ steps.check-vault.outputs.status }}' !== '200') failed.push('crypto-vault');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 ヘルスチェック失敗: ${failed.join(', ')}`,
              body: [
                '## 自動ヘルスチェック失敗',
                '',
                '以下のアプリで異常を検知しました:',
                failed.map(f => `- ❌ ${f}`).join('\n'),
                '',
                `検知時刻: ${new Date().toLocaleString('ja-JP', {timeZone:'Asia/Tokyo'})}`,
                '',
                '[Actions ログを確認する](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
              ].join('\n'),
              labels: ['bug', 'automated'],
            });

  # ────────────────────────────────────────────
  # JOB 3: bridge.js が全アプリで参照可能か確認
  # ────────────────────────────────────────────
  check-bridge:
    name: 🔗 Bridge.js 整合性チェック
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bridge.js exists
        run: |
          if [ -f bridge.js ]; then
            echo "✅ bridge.js 存在確認 OK"
            echo "bridge_exists=true" >> $GITHUB_ENV
          else
            echo "⚠️ bridge.js が見つかりません"
            echo "bridge_exists=false" >> $GITHUB_ENV
          fi

      - name: Check bridge.js URL reachable
        run: |
          URL="https://norinori-jan.github.io/security-hub/bridge.js"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ bridge.js URL: アクセス可能"
          else
            echo "⚠️ bridge.js URL: HTTP $STATUS"
          fi

      - name: Bridge Summary
        run: |
          echo "## 🔗 Bridge.js チェック" >> $GITHUB_STEP_SUMMARY
          echo "- ローカル存在: ${{ env.bridge_exists }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://norinori-jan.github.io/security-hub/bridge.js" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB 4: fortune-project API ヘルスチェック（オプション）
  # ────────────────────────────────────────────
  check-fortune-api:
    name: 🔮 fortune-project API チェック
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true   # API が落ちていても他ジョブを止めない
    steps:
      - name: Check fortune API
        run: |
          # ローカルAPIは外部からアクセス不可のためスキップ
          # 将来 Render / Railway などにデプロイした際はURLを差し替える
          echo "ℹ️ fortune-project API はローカル動作中（http://localhost:8000）"
          echo "   外部デプロイ後にURLを設定してください"
          echo "## 🔮 fortune-project API" >> $GITHUB_STEP_SUMMARY
          echo "- ステータス: ローカル動作中（外部公開URL未設定）" >> $GITHUB_STEP_SUMMARY
          echo "- デプロイ候補: Render / Railway / Fly.io" >> $GITHUB_STEP_SUMMARY
